spring.application.name=secretbook-api
server.port=${PORT:8080}

# Banco de dados. Os valores padrão apontam para o compose.yaml (somente desenvolvimento local);
# em qualquer outro ambiente, defina DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/secretbook}
spring.datasource.username=${DB_USERNAME:secretbook}
spring.datasource.password=${DB_PASSWORD:secretbook}

# O esquema é responsabilidade do Flyway (src/main/resources/db/migration); o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Carrega coleções (autores, gêneros, pistas) em lotes, evitando uma consulta por livro.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration

# Sem usuário em memória gerado pelo Spring Security: a autenticação real chega em uma etapa própria.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Autenticação. A chave padrão serve SÓ para desenvolvimento: em qualquer outro ambiente defina JWT_SECRET.
secretbook.auth.jwt-secret=${JWT_SECRET:dev-only-secretbook-jwt-secret-troque-em-producao}
secretbook.auth.token-ttl=${AUTH_TOKEN_TTL:12h}
secretbook.auth.password-reset-ttl=30m
secretbook.auth.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Administrador inicial (criado na subida se ainda não existir). Sem ADMIN_PASSWORD, nenhum admin é criado.
# O login é pelo nome de usuário; o e-mail é opcional (também serve para entrar e para recuperar a senha).
secretbook.admin.username=${ADMIN_USERNAME:admin}
secretbook.admin.email=${ADMIN_EMAIL:}
secretbook.admin.password=${ADMIN_PASSWORD:}
secretbook.admin.name=${ADMIN_NAME:Administrador}

# Origens do frontend autorizadas a chamar a API (lista separada por vírgulas).
secretbook.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Documentação da API: /swagger-ui.html (interface) e /v3/api-docs (JSON)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json

management.endpoints.web.exposure.include=health
