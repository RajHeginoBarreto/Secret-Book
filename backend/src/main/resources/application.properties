spring.application.name=secretbook-api
server.port=${PORT:8080}

# Banco de dados. Os valores padrão apontam para o compose.yaml (somente desenvolvimento local);
# em qualquer outro ambiente, defina DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/secretbook}
spring.datasource.username=${DB_USERNAME:secretbook}
spring.datasource.password=${DB_PASSWORD:secretbook}

# O esquema é responsabilidade do Flyway (src/main/resources/db/migration); o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Sem usuário em memória gerado pelo Spring Security: a autenticação real chega em uma etapa própria.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Origens do frontend autorizadas a chamar a API (lista separada por vírgulas).
secretbook.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Documentação da API: /swagger-ui.html (interface) e /v3/api-docs (JSON)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json

management.endpoints.web.exposure.include=health
