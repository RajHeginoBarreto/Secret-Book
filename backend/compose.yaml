# Banco de dados local para desenvolvimento: docker compose up -d
# A porta do host é 5433 para não conflitar com um PostgreSQL já instalado na máquina (5432).
name: secretbook

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: secretbook
      POSTGRES_USER: secretbook
      POSTGRES_PASSWORD: secretbook
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - secretbook-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretbook -d secretbook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  secretbook-pgdata:
