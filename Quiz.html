<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | Secret Book</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <a href="index.html#inicio" aria-label="Voltar ao início">
                <img src="img/secret_book_logo_final.svg" alt="Logo Secret Book">
            </a>
            <h1>Secret Book</h1>
        </div>

        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html#inicio">Home</a></li>
                <li><a href="index.html#sobre">Como Funciona</a></li>
                <li><a href="index.html#pistas">Pistas</a></li>
                <li><a href="index.html#planos">Planos</a></li>
                <li><a href="Quiz.html" class="menu-quiz">Fazer o Quiz</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="qz-topo">
            <span class="sobretitulo">✦ Quiz Secret Book</span>
            <h2>Vamos descobrir seu próximo livro</h2>
        </section>

        <section class="qz-caixa" id="quiz-caixa">

            <div id="quiz-perguntas">
                <div class="qz-info">
                    <span id="qz-contador">Pergunta 1 de 6</span>
                    <span id="qz-porcentagem">0%</span>
                </div>
                <div class="qz-barra"><i id="qz-progresso"></i></div>

                <h3 class="qz-pergunta" id="qz-pergunta"></h3>
                <div id="qz-opcoes"></div>
                <div class="qz-erro" id="qz-erro" role="alert"></div>

                <div class="qz-botoes">
                    <button type="button" class="botao botao-voltar" id="qz-voltar" hidden>← Voltar</button>
                    <button type="button" class="botao botao-principal" id="qz-proxima">Próxima →</button>
                </div>
            </div>

            <div class="qz-resultado" id="quiz-resultado" hidden>
                <span class="sobretitulo">✦ Seu perfil literário</span>
                <h3 id="res-genero"></h3>
                <p id="res-texto"></p>

                <div class="qz-afinidade" id="res-afinidade"></div>

                <div class="pista-visual qz-livro">
                    <div class="pista-faixa"></div>
                    <div class="pista-cartao">
                        <span id="res-mes"></span>
                        <strong id="res-tema"></strong>
                        <p id="res-detalhes"></p>
                        <em id="res-pista"></em>
                        <small id="res-palavras"></small>
                    </div>
                </div>

                <div class="qz-botoes">
                    <a href="#" class="botao botao-principal" id="res-whatsapp" target="_blank" rel="noopener">Quero esse livro pelo WhatsApp</a>
                    <a href="index.html#planos" class="botao botao-voltar">Ver planos</a>
                    <button type="button" class="botao botao-voltar" id="qz-refazer">Refazer o quiz</button>
                </div>
            </div>

        </section>

    </main>

    <a href="https://wa.me/5548998017673" class="whatsapp-flutuante" target="_blank" rel="noopener" aria-label="Fale com a gente pelo WhatsApp">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16.04 3C8.86 3 3.03 8.82 3.03 16c0 2.3.6 4.54 1.74 6.52L3 29l6.65-1.74A12.95 12.95 0 0 0 16.04 29C23.2 29 29 23.18 29 16S23.2 3 16.04 3Zm0 23.62c-2 0-3.96-.54-5.67-1.56l-.4-.24-3.95 1.03 1.05-3.85-.26-.4A10.6 10.6 0 0 1 5.4 16c0-5.86 4.77-10.62 10.64-10.62 5.86 0 10.6 4.76 10.6 10.62 0 5.86-4.75 10.62-10.6 10.62Zm5.82-7.95c-.32-.16-1.88-.93-2.17-1.03-.29-.11-.5-.16-.71.16-.21.32-.82 1.03-1 1.24-.19.21-.37.24-.69.08-.32-.16-1.35-.5-2.56-1.58-.95-.85-1.59-1.89-1.77-2.21-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.1-.21.05-.4-.03-.56-.08-.16-.71-1.71-.98-2.34-.26-.62-.52-.53-.71-.54h-.61c-.21 0-.56.08-.85.4-.29.32-1.11 1.09-1.11 2.65 0 1.56 1.14 3.07 1.3 3.28.16.21 2.24 3.42 5.43 4.8.76.33 1.35.52 1.81.67.76.24 1.45.2 2 .12.61-.09 1.88-.77 2.14-1.51.27-.74.27-1.38.19-1.51-.08-.13-.29-.21-.61-.37Z"/></svg>
    </a>

    <footer class="rodape">
        <strong>Secret Book</strong>
        <span>Uma experiência literária dentro de uma caixinha.</span>
    </footer>

    <script>
        const WHATSAPP = "5548998017673";

        // Cada opção soma um ponto para um gênero e guarda uma palavra-chave,
        // usada no cartão de pistas do resultado.
        // Troque as perguntas e respostas à vontade.
        const perguntas = [
            {
                texto: "Em uma noite livre, o que você prefere fazer?",
                opcoes: [
                    { texto: "Assistir a uma série de investigação", genero: "misterio", palavra: "investigação" },
                    { texto: "Ver uma comédia romântica", genero: "romance", palavra: "encontros" },
                    { texto: "Jogar um RPG ou ver um filme de aventura", genero: "fantasia", palavra: "jornada" },
                    { texto: "Ver um documentário sobre o espaço", genero: "ficcao", palavra: "espaço" }
                ]
            },
            {
                texto: "Que tipo de história te prende mais?",
                opcoes: [
                    { texto: "Cheia de segredos e reviravoltas", genero: "misterio", palavra: "segredo" },
                    { texto: "Com personagens e emoções intensas", genero: "romance", palavra: "paixão" },
                    { texto: "Em mundos mágicos e criaturas incríveis", genero: "fantasia", palavra: "magia" },
                    { texto: "Sobre o futuro e a tecnologia", genero: "ficcao", palavra: "tecnologia" }
                ]
            },
            {
                texto: "Qual destes lugares você gostaria de visitar?",
                opcoes: [
                    { texto: "Uma ilha isolada e misteriosa", genero: "misterio", palavra: "ilha" },
                    { texto: "Uma cidade charmosa na Europa", genero: "romance", palavra: "Europa" },
                    { texto: "Um reino encantado", genero: "fantasia", palavra: "reino" },
                    { texto: "Uma estação espacial", genero: "ficcao", palavra: "estação espacial" }
                ]
            },
            {
                texto: "Como você gosta que um livro termine?",
                opcoes: [
                    { texto: "Com uma revelação que muda tudo", genero: "misterio", palavra: "revelação" },
                    { texto: "Com um final emocionante", genero: "romance", palavra: "final feliz" },
                    { texto: "Com uma grande batalha vencida", genero: "fantasia", palavra: "batalha" },
                    { texto: "Com uma ideia que me faça pensar", genero: "ficcao", palavra: "dilema" }
                ]
            },
            {
                texto: "Qual superpoder você escolheria?",
                opcoes: [
                    { texto: "Ler pensamentos", genero: "misterio", palavra: "mente" },
                    { texto: "Fazer todos se sentirem amados", genero: "romance", palavra: "afeto" },
                    { texto: "Usar magia", genero: "fantasia", palavra: "feitiço" },
                    { texto: "Viajar no tempo", genero: "ficcao", palavra: "viagem no tempo" }
                ]
            },
            {
                texto: "Como seria o livro perfeito para você?",
                opcoes: [
                    { texto: "Um que eu não consiga largar até descobrir o culpado", genero: "misterio", palavra: "culpado" },
                    { texto: "Um que me faça rir e chorar", genero: "romance", palavra: "emoção" },
                    { texto: "Um que me transporte para outro mundo", genero: "fantasia", palavra: "outro mundo" },
                    { texto: "Um que me faça imaginar o que vem pela frente", genero: "ficcao", palavra: "futuro" }
                ]
            }
        ];

        const nomesGeneros = {
            misterio: "Mistério",
            romance: "Romance",
            fantasia: "Fantasia",
            ficcao: "Ficção científica"
        };

        // Temas: um gênero puro ou a combinação dos dois mais fortes
        // (chave em ordem alfabética, separada por "+").
        // "livro" é o cartão de pistas do livro do mês para aquele tema.
        const temas = {
            misterio: {
                nome: "Mistério clássico",
                texto: "Você gosta de segredos, pistas e reviravoltas. Seu livro vai te desafiar a descobrir tudo antes do final.",
                livro: { paginas: 312, avaliacao: "4,6", pista: "Ninguém sai da ilha até a verdade aparecer." }
            },
            romance: {
                nome: "Romance de tirar o fôlego",
                texto: "Você se conecta com personagens e sentimentos. Seu livro vai ter uma história para se apaixonar — e talvez chorar um pouquinho.",
                livro: { paginas: 368, avaliacao: "4,7", pista: "Duas pessoas, um verão e uma promessa difícil de cumprir." }
            },
            fantasia: {
                nome: "Fantasia épica",
                texto: "Você quer sair da realidade e explorar mundos novos. Seu livro vai ser uma viagem cheia de magia e coragem.",
                livro: { paginas: 480, avaliacao: "4,8", pista: "Um mapa antigo, um reino dividido e uma heroína improvável." }
            },
            ficcao: {
                nome: "Ficção científica",
                texto: "Você tem curiosidade sobre o futuro e as possibilidades. Seu livro vai fazer sua imaginação ir longe.",
                livro: { paginas: 344, avaliacao: "4,5", pista: "A última mensagem da Terra chegou com 40 anos de atraso." }
            },
            "misterio+romance": {
                nome: "Suspense romântico",
                texto: "Você quer sentir o coração acelerar — de medo e de amor. Seu livro mistura um segredo perigoso com uma paixão inesperada.",
                livro: { paginas: 336, avaliacao: "4,6", pista: "Ela voltou para a cidade natal. Ele sabe o que aconteceu naquela noite." }
            },
            "fantasia+misterio": {
                nome: "Fantasia sombria",
                texto: "Magia e enigmas na mesma medida. Seu livro tem um mundo encantado onde nada é o que parece.",
                livro: { paginas: 412, avaliacao: "4,7", pista: "Na academia de magia, um aluno desaparece a cada lua cheia." }
            },
            "ficcao+misterio": {
                nome: "Thriller futurista",
                texto: "Você gosta de pensar e de desconfiar de tudo. Seu livro é um mistério tecnológico cheio de reviravoltas.",
                livro: { paginas: 328, avaliacao: "4,5", pista: "A inteligência artificial é a única testemunha do crime." }
            },
            "fantasia+romance": {
                nome: "Romantasia",
                texto: "Você quer magia e um romance de arrancar suspiros. Seu livro tem reinos, segredos e um amor que muda o destino de todos.",
                livro: { paginas: 456, avaliacao: "4,8", pista: "Inimigos jurados, um pacto mágico e um sentimento proibido." }
            },
            "ficcao+romance": {
                nome: "Amor além do tempo",
                texto: "Você gosta de grandes ideias, mas quer sentir. Seu livro é uma história de amor que desafia o tempo e o espaço.",
                livro: { paginas: 352, avaliacao: "4,6", pista: "Cartas que chegam do futuro, escritas por alguém que ela ainda não conheceu." }
            },
            "fantasia+ficcao": {
                nome: "Mundos impossíveis",
                texto: "Para você, quanto mais longe da realidade, melhor. Seu livro mistura aventura épica com mundos que ainda vão existir.",
                livro: { paginas: 498, avaliacao: "4,7", pista: "Uma nave perdida pousa em um planeta onde a magia é real." }
            }
        };

        let atual = 0;
        const escolhas = []; // guarda o índice da opção escolhida em cada pergunta

        const $ = (id) => document.getElementById(id);

        function mostrarPergunta() {
            const p = perguntas[atual];
            $("qz-contador").textContent = "Pergunta " + (atual + 1) + " de " + perguntas.length;
            const pct = Math.round((atual / perguntas.length) * 100);
            $("qz-porcentagem").textContent = pct + "%";
            $("qz-progresso").style.width = pct + "%";
            $("qz-pergunta").textContent = p.texto;
            $("qz-erro").textContent = "";
            $("qz-voltar").hidden = atual === 0;
            $("qz-proxima").textContent = atual === perguntas.length - 1 ? "Ver resultado" : "Próxima →";

            const area = $("qz-opcoes");
            area.innerHTML = "";
            p.opcoes.forEach((op, i) => {
                const b = document.createElement("button");
                b.type = "button";
                b.className = "qz-opcao" + (escolhas[atual] === i ? " selecionada" : "");
                b.innerHTML = '<span class="letra">' + "ABCD"[i] + "</span>" + op.texto;
                b.addEventListener("click", () => {
                    escolhas[atual] = i;
                    $("qz-erro").textContent = "";
                    area.querySelectorAll(".qz-opcao").forEach((x) => x.classList.remove("selecionada"));
                    b.classList.add("selecionada");
                });
                area.appendChild(b);
            });
        }

        function mostrarResultado() {
            const respostas = escolhas.map((indice, n) => perguntas[n].opcoes[indice]);

            // Pontua cada gênero. Em caso de empate, vence o gênero escolhido
            // nas perguntas mais finais (que falam mais do livro em si).
            const pontos = {};
            const ultimaVez = {};
            respostas.forEach((r, n) => {
                pontos[r.genero] = (pontos[r.genero] || 0) + 1;
                ultimaVez[r.genero] = n;
            });
            const ranking = Object.keys(pontos).sort(
                (a, b) => pontos[b] - pontos[a] || ultimaVez[b] - ultimaVez[a]
            );

            // Se o segundo gênero teve pelo menos 2 respostas, o tema vira uma mistura.
            const principal = ranking[0];
            const segundo = ranking[1];
            const chave = segundo && pontos[segundo] >= 2
                ? [principal, segundo].sort().join("+")
                : principal;
            const tema = temas[chave];

            $("res-genero").textContent = tema.nome;
            $("res-texto").textContent = tema.texto;

            // Barras de afinidade com cada gênero
            const afinidade = $("res-afinidade");
            afinidade.innerHTML = "";
            ranking.forEach((g) => {
                const pct = Math.round((pontos[g] / respostas.length) * 100);
                const linha = document.createElement("div");
                linha.className = "qz-afinidade-linha";
                linha.innerHTML =
                    "<span>" + nomesGeneros[g] + "</span>" +
                    '<div class="qz-barra"><i style="width:' + pct + '%"></i></div>' +
                    "<b>" + pct + "%</b>";
                afinidade.appendChild(linha);
            });

            // Cartão de pistas do livro do mês, com palavras-chave tiradas das respostas
            const mes = new Date().toLocaleDateString("pt-BR", { month: "long" });
            const palavras = respostas
                .filter((r) => r.genero === principal || r.genero === segundo)
                .map((r) => r.palavra)
                .slice(0, 4);

            $("res-mes").textContent = "Seu livro de " + mes;
            $("res-tema").textContent = tema.nome;
            $("res-detalhes").textContent = tema.livro.paginas + " páginas · avaliação " + tema.livro.avaliacao;
            $("res-pista").textContent = "“" + tema.livro.pista + "”";
            $("res-palavras").textContent = palavras.join(" · ");

            const mensagem =
                "Olá, Secret Book! Fiz o quiz no site e meu perfil literário deu *" + tema.nome + "*. " +
                "Quero receber o livro de " + mes + "!";
            $("res-whatsapp").href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(mensagem);

            $("quiz-perguntas").hidden = true;
            $("quiz-resultado").hidden = false;
        }

        $("qz-proxima").addEventListener("click", () => {
            if (escolhas[atual] === undefined) {
                $("qz-erro").textContent = "Escolha uma resposta primeiro";
                return;
            }
            if (atual === perguntas.length - 1) {
                mostrarResultado();
            } else {
                atual++;
                mostrarPergunta();
            }
        });

        $("qz-voltar").addEventListener("click", () => {
            if (atual > 0) {
                atual--;
                mostrarPergunta();
            }
        });

        $("qz-refazer").addEventListener("click", () => {
            atual = 0;
            escolhas.length = 0;
            $("quiz-resultado").hidden = true;
            $("quiz-perguntas").hidden = false;
            mostrarPergunta();
        });

        mostrarPergunta();
    </script>

</body>

</html>
